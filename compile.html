<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Maplat TIN compiler</title>
<style>body{font-family:sans-serif;margin:16px}pre{white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto;background:#f4f4f4;padding:8px}</style>
</head>
<body>
<h1>迅速測図 (淵野辺) の TIN コンパイル</h1>
<p>gcps.json の対応点から @maplat/tin で TIN を作り、maps/rapid_fuchinobe.json の中身を出力します。</p>
<p id="status">compiling...</p>
<button id="dl" disabled>maps/rapid_fuchinobe.json をダウンロード</button>
<pre id="out"></pre>
<script type="module">
import Tin from "https://cdn.jsdelivr.net/npm/@maplat/tin@1.0.0/dist/maplat_tin.js";
(async () => {
  const gcp = await (await fetch("gcps.json")).json();
  const tin = new Tin({
    wh: [gcp.width, gcp.height],
    yaxisMode: "invert",
    vertexMode: "plain",
    strictMode: "auto"
  });
  tin.setPoints(gcp.gcps);
  tin.updateTin(); // updateTinAsync() は CDN 版だと完了しないため同期版を使う
  const map = Object.assign({}, gcp.meta, { compiled: tin.getCompiled() });
  const json = JSON.stringify(map);
  window.__RESULT__ = json;
  document.getElementById("out").textContent = json.slice(0, 3000) + (json.length > 3000 ? " ..." : "");
  document.getElementById("status").textContent =
    `done: ${gcp.gcps.length} GCPs, strict_status=${map.compiled.strict_status}, ${json.length} bytes`;
  const btn = document.getElementById("dl");
  btn.disabled = false;
  btn.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = "rapid_fuchinobe.json";
    a.click();
  };
})().catch(e => { document.getElementById("status").textContent = "error: " + e; console.error(e); });
</script>
</body>
</html>
